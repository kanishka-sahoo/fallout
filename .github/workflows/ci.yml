name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      falkordb:  # the BFS and anchor tests use a temporary graph
        image: falkordb/falkordb:latest
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci  # the fix planner and grader call workers/semver-eval.mjs
        working-directory: workers
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy ingest fallout eval api mcp_server analysis
      - run: uv run pytest
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: workers
      - run: npm test
        working-directory: workers
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: web
