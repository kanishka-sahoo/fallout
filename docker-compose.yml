# Grows service by service: api, web, sandbox and oracle are added as they are built (BUILD.md §13).
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6380}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3001}:3000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  falkordb_data:
