# Grows service by service: api, web, sandbox and oracle are added as they are built (BUILD.md §13).
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6380}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3001}:3000"
    environment:
      # The image defaults cap result sets at 10k rows and kill queries after 1 s; both
      # silently truncate the blast radius on a 33k-version graph.
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 0 TIMEOUT_MAX 0 TIMEOUT_DEFAULT 0 RESULTSET_SIZE -1"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  falkordb_data:
