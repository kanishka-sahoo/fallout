# The whole stack from a snapshot, no crawl (BUILD.md §15):
#   scripts/snapshot.sh            on the machine that has the graph (writes data/snapshots/)
#   docker compose build sandbox   the token-free lockfile sandbox image
#   docker compose up -d           seed -> falkordb -> api (console on :8000)
services:
  # Copies data/snapshots/dump.rdb into an empty FalkorDB volume on first start, then exits.
  seed:
    image: alpine:3.20
    volumes:
      - falkordb_data:/target
      - ./data/snapshots:/snapshots:ro
    command: >
      sh -c 'if [ -f /target/dump.rdb ]; then echo "graph already seeded";
             elif [ -f /snapshots/dump.rdb ]; then cp /snapshots/dump.rdb /target/ && echo "seeded from snapshot";
             else echo "no data/snapshots/dump.rdb: run scripts/snapshot.sh" && exit 1; fi'

  falkordb:
    image: falkordb/falkordb:latest
    depends_on:
      seed: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6380}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3001}:3000"
    environment:
      # The image defaults cap result sets at 10k rows and kill queries after 1 s; both
      # silently truncate the blast radius on a 33k-version graph.
      # (Plain `TIMEOUT` together with TIMEOUT_MAX makes FalkorDB 4.22 abort on load.)
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT_MAX 0 TIMEOUT_DEFAULT 0 RESULTSET_SIZE -1"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      falkordb: { condition: service_healthy }
    env_file: .env  # OPENAI_API_KEY, FALLOUT_GH_TOKEN, FALLOUT_CONSOLE_KEY, FALLOUT_APPROVAL_SECRET
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALLOUT_SANDBOX_TMP: ${PWD}/data/tmp
    ports:
      - "${FALLOUT_API_BIND:-127.0.0.1}:${FALLOUT_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      # The sandbox runs on the host daemon, so its work dir must exist at the same path on both sides.
      - ${PWD}/data/tmp:${PWD}/data/tmp
      # Only the fix executor uses this, to start the sandbox container (api/fix_executor.py).
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Built once and run per fix by the executor; never started by `up`.
  sandbox:
    build: workers/sandbox
    image: fallout-sandbox
    profiles: ["build"]

volumes:
  falkordb_data:
