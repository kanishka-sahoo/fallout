# Runs the full stack from a snapshot, without a crawl:
#   scripts/snapshot.sh            run on the machine that has the graph (writes data/snapshots/)
#   docker compose build sandbox   builds the lockfile sandbox image (it has no tokens)
#   docker compose up -d           starts seed, then falkordb, then api (console on :8000)
services:
  # On first start, copies data/snapshots/dump.rdb into the empty FalkorDB volume, then exits.
  seed:
    image: alpine:3.20
    volumes:
      - falkordb_data:/target
      - ./data/snapshots:/snapshots:ro
    command: >
      sh -c 'if [ -f /target/dump.rdb ]; then echo "graph already seeded";
             elif [ -f /snapshots/dump.rdb ]; then cp /snapshots/dump.rdb /target/ && echo "seeded from snapshot";
             else echo "no data/snapshots/dump.rdb: run scripts/snapshot.sh" && exit 1; fi'

  falkordb:
    image: falkordb/falkordb:latest
    depends_on:
      seed: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6380}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3001}:3000"
    environment:
      # The image defaults limit result sets to 10k rows and stop queries after 1 s. On a
      # 33k-version graph, both limits cut the blast radius short without an error.
      # Do not also set `TIMEOUT`: with TIMEOUT_MAX, it makes FalkorDB 4.22 stop during load.
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT_MAX 0 TIMEOUT_DEFAULT 0 RESULTSET_SIZE -1"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      falkordb: { condition: service_healthy }
    env_file: .env  # OPENAI_API_KEY, FALLOUT_GH_TOKEN, FALLOUT_CONSOLE_KEY, FALLOUT_APPROVAL_SECRET
    # Run as the host user so that files written to ./data are not owned by root.
    # The docker group gives access to the Docker socket (find its GID with `getent group docker`).
    user: "${FALLOUT_UID:-1000}:${FALLOUT_GID:-1000}"
    group_add: ["${DOCKER_GID:-986}"]
    environment:
      HOME: /tmp
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALLOUT_SANDBOX_TMP: ${PWD}/data/tmp
    ports:
      - "${FALLOUT_API_BIND:-127.0.0.1}:${FALLOUT_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      # The sandbox runs on the host's Docker daemon, so its work directory must have the same path in the container and on the host.
      - ${PWD}/data/tmp:${PWD}/data/tmp
      # Only the fix executor (api/fix_executor.py) uses this, to start the sandbox container.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Built once. The fix executor runs it once per fix. `up` does not start it.
  sandbox:
    build: workers/sandbox
    image: fallout-sandbox
    profiles: ["build"]

volumes:
  falkordb_data:
