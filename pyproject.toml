[project]
name = "fallout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
