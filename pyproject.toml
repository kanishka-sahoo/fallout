[project]
name = "fallout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
